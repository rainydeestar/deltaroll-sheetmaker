<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Sheet Renderer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="row">
        <select id="charSelect"></select>
        <button id="addChar" title="New character">+</button>
        <button id="delChar" title="Delete this character">×</button>
      </div>

      <label>Name
        <input id="f-name" type="text">
      </label>
      <label>Subtitle
        <input id="f-subtitle" type="text">
      </label>

      <fieldset>
        <legend>HP</legend>
        <div class="row">
          <input id="f-hpCur" type="number" style="width:60px">
          <span>/</span>
          <input id="f-hpMax" type="number" style="width:60px">
        </div>
      </fieldset>

      <fieldset>
        <legend>Stats</legend>
        <div id="statsList"></div>
        <button id="addStat">+ Add stat</button>
      </fieldset>

      <button id="download" class="primary">Download PNG</button>
      <p class="hint">Drop your pixel art into <code>assets/</code> (see README) — this preview falls back to plain boxes until it finds them.</p>
    </aside>

    <main class="preview">
      <canvas id="sheet" width="320" height="180"></canvas>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Sheet Renderer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="row">
        <select id="charSelect"></select>
        <button id="addChar" title="New character">+</button>
        <button id="delChar" title="Delete this character">×</button>
      </div>
      <button id="download" class="primary">Download PNG</button>
      <p class="hint" id="fontWarning"></p>

      <details open>
        <summary>Header</summary>
        <div id="sec-header" class="fields"></div>
      </details>

      <details>
        <summary>Skills</summary>
        <div id="sec-skills" class="fields"></div>
      </details>

      <details>
        <summary>Equipped</summary>
        <div id="sec-equip" class="fields"></div>
      </details>

      <details>
        <summary>Items (10 slots)</summary>
        <div id="sec-items" class="fields"></div>
      </details>

      <details>
        <summary>Stats</summary>
        <div id="sec-stats" class="fields"></div>
      </details>

      <details>
        <summary>Spells (6 slots)</summary>
        <div id="sec-spells" class="fields"></div>
      </details>
    </aside>

    <main class="preview">
      <canvas id="sheet" width="583" height="1248"></canvas>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
